<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="X 新闻热点 — 多领域实时汇总，中英双语" />
  <title>X 新闻热点</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">𝕏</span>
        <div>
          <h1 id="siteTitle">X 新闻热点</h1>
          <p class="tagline" id="siteTagline">多领域热点 · 整点自动更新</p>
        </div>
      </div>
      <div class="header-meta">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="zh" id="langZh">中文</button>
          <button type="button" class="lang-btn" data-lang="en" id="langEn">EN</button>
        </div>
        <div class="count-pill" id="totalCount">— 条</div>
        <div class="updated" id="updatedAt">更新中…</div>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="filters" id="filters" aria-label="领域筛选"></nav>

    <section class="stats-bar" id="statsBar"></section>

    <section class="grid" id="newsGrid" aria-live="polite">
      <div class="loading" id="loadingMsg">正在加载热点…</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footerNote">内容来自 X 帖子汇总，可能随后变化。正文在本页可直接阅读；重要事实建议核对原文。</p>
      <p class="footer-links">
        <a href="https://x.com" target="_blank" rel="noopener">X / Twitter</a>
        ·
        <a href="https://github.com/feifan19/x-news-hot" target="_blank" rel="noopener" id="footerSource">源码</a>
      </p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
